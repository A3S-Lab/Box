name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  A3S_DEPS_STUB: "1"
  A3S_OCI_RUNTIME_REV: 9c3be8e126dda7ff7add5e6e88c427f68c7d6629

jobs:
  # ── Lint & Format ──────────────────────────────────────────────
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Init submodules
        run: git -c http.extraheader= submodule update --init --recursive
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable 2026-07-16
        with:
          components: rustfmt
      - run: cd src && cargo fmt --all -- --check
      - name: Verify CI and release OCI artifact pins agree
        shell: bash
        run: |
          set -euo pipefail
          read_pin() {
            local workflow="$1"
            local matches
            mapfile -t matches < <(
              sed -nE 's/^[[:space:]]*A3S_OCI_RUNTIME_REV:[[:space:]]*([0-9a-f]{40})[[:space:]]*$/\1/p' \
                "$workflow"
            )
            if [ "${#matches[@]}" -ne 1 ]; then
              echo "$workflow must contain exactly one 40-character OCI revision" >&2
              exit 1
            fi
            printf '%s\n' "${matches[0]}"
          }
          ci_pin="$(read_pin .github/workflows/ci.yml)"
          release_pin="$(read_pin .github/workflows/release.yml)"
          if [ "$ci_pin" != "$release_pin" ]; then
            echo "CI OCI revision $ci_pin differs from release revision $release_pin" >&2
            exit 1
          fi
      - name: Reject removed Sandbox backend integrations
        run: |
          removed_patterns=(
            'A3S_BOX_CR'"UN_PATH"
            'Cr'"unController"
            'Cr'"unHandler"
            'CertifiedCr'"un"
            'CERTIFIED_CR'"UN"
            'pub enum Sandbox'"Runtime"
            'SandboxRuntime::Cr'"un"
            'sandbox_'"runtime:"
            '.sandbox_'"runtime("
            'ExecutionBackend::Cr'"un"
            'sdk-local-sandbox-cr'"un"
          )
          found=0
          for pattern in "${removed_patterns[@]}"; do
            if git grep -n -F "$pattern" -- .github scripts src README.md; then
              found=1
            fi
          done
          if ((found != 0)); then
            echo 'The removed external Sandbox backend was reintroduced'
            exit 1
          fi
      - name: Reject removed remote compatibility service
        run: |
          removed_patterns=(
            'E2'"B"
            'e2'"b"
            'A3SRemote'"Connection"
            'A3SConnection'"Config"
            'A3S_BOX_API_'"KEY"
            'A3S_BOX_'"ENDPOINT"
            'A3S_BOX_'"DOMAIN"
            'A3S_BOX_SANDBOX_'"URL"
          )
          found=0
          for pattern in "${removed_patterns[@]}"; do
            if git grep -n -I -F -e "$pattern" -- \
              .github compat deploy docs scripts sdk src README.md \
              ':(exclude,glob)**/Cargo.lock'; then
              found=1
            fi
          done
          if ((found != 0)); then
            echo 'The removed remote compatibility service was reintroduced'
            exit 1
          fi
      - name: Reject removed external build and Docker execution paths
        run: |
          removed_patterns=(
            'buildkit-'"vm"
            'build_'"buildkit_vm"
            'A3S_BOX_BUILD'"KIT"
            'Build'"Backend"
            '--buildkit-'"image"
            '--buildkit-'"cpus"
            '--buildkit-'"memory"
            'build'"ctl"
            'moby/build'"kit"
            'boll'"ard"
          )
          found=0
          for pattern in "${removed_patterns[@]}"; do
            if git grep -n -I -F -e "$pattern" -- \
              .github docs scripts src README.md justfile \
              ':(exclude)src/Cargo.lock'; then
              found=1
            fi
          done
          removed_commands=(
            'docker '"build"
            'docker '"run"
            'docker '"pull"
            'docker '"push"
            'docker '"tag"
            'docker '"save"
            'docker '"load"
            'docker '"volume"
            'docker '"info"
            'command -v '"docker"
          )
          for pattern in "${removed_commands[@]}"; do
            if git grep -n -I -F -e "$pattern" -- \
              .github bench scripts src/deps justfile \
              ':(exclude)src/Cargo.lock'; then
              found=1
            fi
          done
          if ((found != 0)); then
            echo 'A removed external build or Docker execution path was reintroduced'
            exit 1
          fi
      - name: Enforce the sole recorded-build authority
        run: |
          removed_patterns=(
            'BuildSupervisor'"Store"
            'BuildOperation'"Store"
            'BuildReceipt'"Store"
            'BuildWorkspace'"Store"
            'BuildJob'"Queue"
            'BuildOperation'"Queue"
            'Build'"Scheduler"
            'BuildImage'"Store"
            'BuildCache'"Store"
            'BuildCache'"Service"
            'BuildCache'"Queue"
            'BuildCache'"Scheduler"
            'CacheExport'"Store"
            'CacheExport'"Publisher"
            'CacheImport'"Store"
            'CacheImport'"Service"
            'CacheHydration'"Store"
            'CacheHydration'"Queue"
            'BuildAssembly'"Store"
            'BuildAssembly'"Queue"
            'BuildAssembly'"Scheduler"
            'BuildAssembly'"Journal"
            'BuildOutputAssembly'"Store"
            'BuildIndex'"Validator"
            'AssemblyOutput'"Validator"
            'MultiPlatformOutput'"Validator"
            'OciAssembly'"Validator"
            'Manifest'"Store"
            'ImageIndex'"Store"
            'OciIndex'"Store"
            'BuildManifest'"Publisher"
            'BuildIndex'"Publisher"
            'build-operations.'"json"
            'build-jobs.'"json"
            'build-queue.'"json"
            'build-cache-exports.'"json"
          )
          found=0
          for pattern in "${removed_patterns[@]}"; do
            if git grep -n -I -F -e "$pattern" -- \
              .github docs scripts src README.md justfile \
              ':(exclude)src/Cargo.lock'; then
              found=1
            fi
          done
          if ((found != 0)); then
            echo 'A second recorded-build store, queue, scheduler, or image authority was introduced'
            exit 1
          fi

          require_single_authority() {
            local pattern="$1"
            local expected_file="$2"
            local actual_files
            actual_files="$(git grep -l -F "$pattern" -- \
              src/runtime/src/oci/build || true)"
            if [[ "$actual_files" != "$expected_file" ]]; then
              echo "Recorded-build authority '$pattern' must exist only in $expected_file"
              exit 1
            fi
          }

          require_single_authority \
            'pub async fn start_recorded_build_plan' \
            'src/runtime/src/oci/build/execution.rs'
          require_single_authority \
            'pub async fn cancel_recorded_build_plan' \
            'src/runtime/src/oci/build/execution.rs'
          require_single_authority \
            'pub struct BuildOperationJournal' \
            'src/runtime/src/oci/build/receipt/journal.rs'
          require_single_authority \
            'fn persist_record(' \
            'src/runtime/src/oci/build/receipt/journal.rs'
          require_single_authority \
            'fn remove_operation_directory_if_present(' \
            'src/runtime/src/oci/build/receipt/journal.rs'
          require_single_authority \
            'pub(crate) struct BuildCache {' \
            'src/runtime/src/oci/build/cache.rs'
          require_single_authority \
            'fn publish_entry_unlocked(' \
            'src/runtime/src/oci/build/cache.rs'
          require_single_authority \
            'pub(in crate::oci::build) fn stage_export(' \
            'src/runtime/src/oci/build/cache/export.rs'
          require_single_authority \
            'fn validate_build_cache_artifact(' \
            'src/runtime/src/oci/build/cache/export/validation.rs'
          require_single_authority \
            'pub async fn hydrate_recorded_build_cache' \
            'src/runtime/src/oci/build/cache/import.rs'
          require_single_authority \
            'pub(in crate::oci::build) async fn publish_cache_export(' \
            'src/runtime/src/oci/build/receipt/journal.rs'
          require_single_authority \
            'pub(in crate::oci::build) async fn cleanup_cache_export(' \
            'src/runtime/src/oci/build/receipt/journal.rs'
          require_single_authority \
            'pub async fn assemble_recorded_build_outputs' \
            'src/runtime/src/oci/build/assembly.rs'
          require_single_authority \
            'fn copy_recorded_build_blobs(' \
            'src/runtime/src/oci/build/assembly.rs'
          require_single_authority \
            'fn inspect_build_output_layout(' \
            'src/runtime/src/oci/build/output/validation.rs'
          require_single_authority \
            'async fn publish_build_output(' \
            'src/runtime/src/oci/build/output/mod.rs'
          require_single_authority \
            'fn spawn_supervised_build(' \
            'src/runtime/src/oci/build/execution.rs'
          require_single_authority \
            'pub(super) struct JournalBuildObserver {' \
            'src/runtime/src/oci/build/execution/supervision.rs'
          require_single_authority \
            'store.put(reference' \
            'src/runtime/src/oci/build/output/mod.rs'
          require_single_authority \
            'tokio::process::Command' \
            'src/runtime/src/oci/build/engine/run_process.rs'

          if git grep -n -I -E \
            '(tokio|std)::sync::(mpsc|broadcast|watch)|\b(VecDeque|BinaryHeap)\b' -- \
            src/runtime/src/oci/build/execution.rs \
            src/runtime/src/oci/build/execution/supervision.rs \
            src/runtime/src/oci/build/assembly.rs \
            src/runtime/src/oci/build/cache/import.rs \
            src/runtime/src/oci/build/receipt.rs \
            src/runtime/src/oci/build/receipt/journal.rs \
            src/runtime/src/oci/build/engine/control.rs; then
            echo 'The recorded-build supervisor must not own an in-memory queue or scheduler'
            exit 1
          fi

          if git grep -n -I -E \
            'OciImage::|read_verified_oci_blob|validate_blob_inventory|ImageManifest(::|Builder)' -- \
            src/runtime/src/oci/build/assembly.rs; then
            echo 'OCI index assembly must reuse the sole native output validator'
            exit 1
          fi

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Init submodules
        run: git -c http.extraheader= submodule update --init --recursive
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable 2026-07-16
        with:
          components: clippy
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Create stub libkrun
        run: |
          echo "void krun_stub(void) {}" > /tmp/krun_stub.c
          gcc -shared -o /tmp/libkrun.so /tmp/krun_stub.c
          sudo cp /tmp/libkrun.so /usr/lib/
          sudo ldconfig
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          workspaces: src
      - run: cd src && cargo clippy --locked --workspace --all-targets -- -D warnings

  # ── Tests (stub mode, no VM) ───────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Init submodules
        run: git -c http.extraheader= submodule update --init --recursive
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable 2026-07-16
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Create stub libkrun
        run: |
          echo "void krun_stub(void) {}" > /tmp/krun_stub.c
          gcc -shared -o /tmp/libkrun.so /tmp/krun_stub.c
          sudo cp /tmp/libkrun.so /usr/lib/
          sudo ldconfig
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          workspaces: src
      - name: Test workspace libraries
        shell: bash
        run: |
          set +e
          log="$RUNNER_TEMP/a3s-box-workspace-tests.log"
          (
            cd src
            CARGO_TERM_COLOR=never cargo test --locked --workspace --lib 2>&1
          ) | tee "$log"
          status=${PIPESTATUS[0]}
          if ((status != 0)); then
            diagnostic="$(tail -c 3800 "$log")"
            diagnostic="${diagnostic//'%'/'%25'}"
            diagnostic="${diagnostic//$'\r'/'%0D'}"
            diagnostic="${diagnostic//$'\n'/'%0A'}"
            echo "::error title=Workspace library test failure::$diagnostic"
          fi
          exit "$status"
      - name: Test deterministic CLI workflows
        run: |
          cd src
          set +e
          log="$RUNNER_TEMP/a3s-box-deterministic-cli-tests.log"
          cargo test --locked -p a3s-box-cli \
            --test command_coverage --test wait_integration \
            2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          if ((status != 0)); then
            diagnostic="$(tail -c 3800 "$log")"
            diagnostic="${diagnostic//'%'/'%25'}"
            diagnostic="${diagnostic//$'\r'/'%0D'}"
            diagnostic="${diagnostic//$'\n'/'%0A'}"
            echo "::error title=Deterministic CLI workflow failure::$diagnostic"
          fi
          exit "$status"
      - name: Compile local SDK real-runtime smoke
        run: cd src && cargo test --locked -p a3s-box-sdk --test local_sandbox --no-run

  # The RuntimeClass shim is an intentionally standalone Cargo workspace, so
  # none of the src workspace gates above compile or test it.
  containerd-shim:
    name: Containerd Shim (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable 2026-07-16
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          workspaces: containerd-shim
      - name: Check formatting
        working-directory: containerd-shim
        run: cargo fmt --all -- --check
      - name: Lint
        working-directory: containerd-shim
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        working-directory: containerd-shim
        run: cargo test --locked --all-targets
      - name: Test RuntimeClass installer
        run: bash deploy/scripts/test-install-runtimeclass.sh

  # ── Native Python, TypeScript, and Go SDK package gate ─────────
  sdk-packages:
    name: SDK Packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.25.x'
          cache-dependency-path: sdk/go/go.mod
      - name: Build and test Python package
        run: |
          python -m pip install build
          python -m build sdk/python
          python -m venv /tmp/a3s-box-python-sdk
          /tmp/a3s-box-python-sdk/bin/pip install sdk/python/dist/*.whl
          /tmp/a3s-box-python-sdk/bin/python -m unittest discover -s sdk/python/tests
      - name: Build and test TypeScript package
        working-directory: sdk/typescript
        run: |
          npm ci
          npm run build
          npm test
          npm pack --dry-run
      - name: Format, vet, and test Go module
        working-directory: sdk/go
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi
          go vet ./...
          go test ./...
          go test -race ./...

  # ── Real shared-kernel local SDK gate ──────────────────────────
  sdk-local-sandbox:
    name: ${{ matrix.job_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - job_name: SDK Local Sandbox (A3S OCI Runtime)
            os: ubuntu-24.04
            guest_target: x86_64-unknown-linux-musl
            platform: linux-x86_64
            recovery_artifact: a3s-box-native-owner-recovery
          - job_name: SDK Local Sandbox (A3S OCI Runtime, aarch64)
            os: ubuntu-24.04-arm
            guest_target: aarch64-unknown-linux-musl
            platform: linux-arm64
            recovery_artifact: a3s-box-native-owner-recovery-aarch64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      A3S_HOME: /tmp/a3s-local-sdk-smoke-runtime-conformance
      A3S_BOX_OCI_RUNTIME_PATH: /tmp/a3s-local-sdk-smoke-runtime-conformance/bin/a3s-oci
      A3S_BOX_OCI_AGENT_PATH: /tmp/a3s-local-sdk-smoke-runtime-conformance/bin/a3s-oci-agent
      A3S_BOX_OCI_HOST_ROOT: /tmp/a3s-box-production-oci-host
      A3S_BOX_OCI_OWNER_RECOVERY_REPORT: /tmp/a3s-box-native-owner-recovery.json
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Init submodules
        run: git -c http.extraheader= submodule update --init --recursive
      - name: Checkout pinned A3S OCI Runtime
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: A3S-Lab/OCI-Runtime
          ref: ${{ env.A3S_OCI_RUNTIME_REV }}
          path: oci-runtime
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.25.x'
          cache-dependency-path: sdk/go/go.mod
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable 2026-07-16
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential libclang-dev libssl-dev musl-tools patchelf \
            pkg-config protobuf-compiler
          rustup target add "${{ matrix.guest_target }}"
          sed -nE \
            's/^[[:space:]]*pub fn (krun_[A-Za-z0-9_]+).*/long \1(void) { return -1; }/p' \
            src/deps/libkrun-sys/src/lib.rs \
            | sort -u > /tmp/krun_stub.c
          test -s /tmp/krun_stub.c
          gcc -shared -o /tmp/libkrun.so /tmp/krun_stub.c
          sudo cp /tmp/libkrun.so /usr/lib/
          sudo ldconfig
      - name: Qualify pinned OCI lifecycle, filesystem, and attachment profiles
        working-directory: oci-runtime
        run: bash .github/scripts/native-linux-smoke.sh
      - name: Build release-layout SDK runtime artifacts
        run: |
          cd src
          cargo clean -p a3s-libkrun-sys
          env -u A3S_DEPS_STUB A3S_BUILD_LIBKRUN=1 \
            cargo build --locked --release -p a3s-box-cli -p a3s-box-shim
          cargo build --locked --release -p a3s-box-guest-init \
            --target "${{ matrix.guest_target }}"
          cd ../oci-runtime
          cargo build --locked --release -p a3s-oci-cli -p a3s-oci-agent
      - name: Package and install the no-KVM product
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/a3s-box-installed-${{ matrix.platform }}"
          bash scripts/package-no-kvm-product.sh \
            "${{ matrix.guest_target }}" \
            "${{ matrix.platform }}" \
            "$A3S_OCI_RUNTIME_REV" \
            "$RUNNER_TEMP" \
            "$install_dir"

          {
            echo "A3S_BOX_INSTALL_DIR=$install_dir"
            echo "A3S_BOX_BINARY=$install_dir/a3s-box"
            echo "A3S_BOX_SHIM_BINARY=$install_dir/a3s-box-shim"
            echo "A3S_BOX_GUEST_INIT_BINARY=$install_dir/a3s-box-guest-init"
            echo "A3S_BOX_OCI_RUNTIME_PATH=$install_dir/a3s-oci"
            echo "A3S_BOX_OCI_AGENT_PATH=$install_dir/a3s-oci-agent"
          } >> "$GITHUB_ENV"

          grep -q '^root:' /etc/subuid ||
            echo 'root:100000:65536' | sudo tee -a /etc/subuid
          grep -q '^root:' /etc/subgid ||
            echo 'root:100000:65536' | sudo tee -a /etc/subgid
      - name: Mount private Runtime Secret tmpfs
        run: |
          sudo install -d -m 700 "$A3S_HOME/runtime-secrets"
          sudo mount -t tmpfs \
            -o size=16m,mode=0700,nosuid,nodev,noexec \
            a3s-runtime-secrets "$A3S_HOME/runtime-secrets"
          mountpoint -q "$A3S_HOME/runtime-secrets"
      - name: Cache the pinned public R17 image over HTTPS
        run: |
          sudo env \
              PATH="$PATH" \
              HOME="$HOME" \
              A3S_DEPS_STUB=1 \
              A3S_HOME="$A3S_HOME" \
              "$A3S_BOX_BINARY" pull \
                'docker.io/library/alpine@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc'
      - name: Certify all advertised R17 profiles and private registry pull
        run: |
          cd src
          sudo env \
              PATH="$PATH" \
              HOME="$HOME" \
              RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}" \
              CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}" \
              A3S_DEPS_STUB=1 \
              A3S_HOME="$A3S_HOME" \
              A3S_BOX_OCI_RUNTIME_PATH="$A3S_BOX_OCI_RUNTIME_PATH" \
              A3S_BOX_OCI_AGENT_PATH="$A3S_BOX_OCI_AGENT_PATH" \
              A3S_BOX_RUNTIME_CONFORMANCE=1 \
              A3S_BOX_RUNTIME_CONFORMANCE_IMAGE='docker.io/library/alpine@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc' \
              A3S_BOX_RUNTIME_CONFORMANCE_MEDIA_TYPE='application/vnd.oci.image.index.v1+json' \
              A3S_REGISTRY_PROTOCOL=http \
              RUST_MIN_STACK=33554432 \
              cargo test --locked -p a3s-box-runtime --lib \
                box_runtime_passes_all_advertised_profiles \
                -- --ignored --nocapture --test-threads=1
      - name: Exercise production Box-to-OCI owner composition
        run: |
          cd src
          set +e
          log="$RUNNER_TEMP/a3s-box-production-oci-owner-composition.log"
          sudo env \
              PATH="$PATH" \
              HOME="$HOME" \
              RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}" \
              CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}" \
              A3S_DEPS_STUB=1 \
              A3S_HOME="$A3S_HOME" \
              A3S_BOX_OCI_MIGRATION=sandbox \
              A3S_BOX_OCI_HOST_ROOT="$A3S_BOX_OCI_HOST_ROOT" \
              A3S_BOX_OCI_RUNTIME_PATH="$A3S_BOX_OCI_RUNTIME_PATH" \
              A3S_BOX_OCI_AGENT_PATH="$A3S_BOX_OCI_AGENT_PATH" \
              A3S_BOX_SDK_LOCAL_SMOKE=1 \
              A3S_BOX_SDK_SMOKE_ISOLATION=sandbox \
              A3S_BOX_SDK_SMOKE_IMAGE='docker.io/library/alpine@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc' \
              RUST_MIN_STACK=16777216 \
              cargo test --locked -p a3s-box-sdk --test local_sandbox \
                local_sandbox_exercises_real_runtime \
                -- --ignored --nocapture --test-threads=1 \
              2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          if ((status != 0)); then
            while IFS= read -r worker_log; do
              {
                echo
                echo "===== $worker_log ====="
                sudo tail -c 3800 "$worker_log"
              } | tee -a "$log"
            done < <(sudo find "$A3S_HOME" -type f -path '*/oci-log-projection/worker.log' -print 2>/dev/null)
            diagnostic="$(tail -c 3800 "$log")"
            diagnostic="${diagnostic//'%'/'%25'}"
            diagnostic="${diagnostic//$'\r'/'%0D'}"
            diagnostic="${diagnostic//$'\n'/'%0A'}"
            echo "::error title=Production Box-to-OCI owner composition failure::$diagnostic"
          fi
          exit "$status"
      - name: Test the installed SDK product with KVM absent and inaccessible
        run: |
          set +e
          log="$RUNNER_TEMP/a3s-box-local-sdk-smoke.log"
          bash scripts/no-kvm-packaged-sdk-smoke.sh 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          if ((status != 0)); then
            while IFS= read -r worker_log; do
              {
                echo
                echo "===== $worker_log ====="
                sudo tail -c 3800 "$worker_log"
              } | tee -a "$log"
            done < <(sudo find "$A3S_HOME" -type f -path '*/oci-log-projection/worker.log' -print 2>/dev/null)
            diagnostic="$(tail -c 3800 "$log")"
            diagnostic="${diagnostic//'%'/'%25'}"
            diagnostic="${diagnostic//$'\r'/'%0D'}"
            diagnostic="${diagnostic//$'\n'/'%0A'}"
            echo "::error title=Local SDK smoke failure::$diagnostic"
          fi
          exit "$status"
      - name: Upload native OCI owner-recovery evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ${{ matrix.recovery_artifact }}
          path: /tmp/a3s-box-native-owner-recovery-*.json
          if-no-files-found: warn
          retention-days: 14
      - name: Verify cleanup
        if: always()
        run: |
          cleanup_status=0
          if [ -f /tmp/a3s-box-ci-kvm-sentinel ]; then
            if [ -c /dev/kvm ]; then
              sudo rm -f /dev/kvm || cleanup_status=1
            fi
            rm -f /tmp/a3s-box-ci-kvm-sentinel || cleanup_status=1
          fi
          sudo python3 - "$A3S_BOX_OCI_HOST_ROOT/box-owner.json" <<'PY' || cleanup_status=1
          import json
          import os
          import pathlib
          import signal
          import sys
          import time

          record_path = pathlib.Path(sys.argv[1])
          if not record_path.exists():
              raise SystemExit(0)
          record = json.loads(record_path.read_text(encoding="utf-8"))
          pid = int(record["pid"])
          expected_start = int(record["pid_start_time"])
          stat_path = pathlib.Path(f"/proc/{pid}/stat")
          if not stat_path.exists():
              raise SystemExit(0)
          raw = stat_path.read_text(encoding="utf-8")
          actual_start = int(raw[raw.rfind(")") + 2:].split()[19])
          if actual_start != expected_start:
              raise RuntimeError("refusing to signal a reused OCI owner PID")
          os.kill(pid, signal.SIGTERM)
          for _ in range(200):
              if not stat_path.exists():
                  break
              time.sleep(0.05)
          else:
              os.kill(pid, signal.SIGKILL)
              for _ in range(100):
                  if not stat_path.exists():
                      break
                  time.sleep(0.05)
              else:
                  raise RuntimeError("OCI owner remained after SIGKILL")
          PY
          if pgrep -f 'a3s-box-shim|a3s-oci.*native-linux-.*service|a3s-oci-agent' >/dev/null; then
            ps aux | grep -E 'a3s-box-shim|a3s-oci.*native-linux-.*service|a3s-oci-agent' | grep -v grep
            cleanup_status=1
          fi
          if mountpoint -q "$A3S_HOME/runtime-secrets"; then
            sudo umount "$A3S_HOME/runtime-secrets" || cleanup_status=1
          fi
          sudo rm -rf "$A3S_BOX_OCI_HOST_ROOT"
          sudo rm -rf "$A3S_HOME"
          exit "$cleanup_status"

  # ── Build check (compile only, no artifacts) ────────────────────
  build-check:
    name: Build Check (${{ matrix.target }})
    needs: [fmt, clippy, test, sdk-packages, sdk-local-sandbox]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            os: ubuntu-latest
          - target: linux-arm64
            os: ubuntu-24.04-arm
          - target: macos-arm64
            os: macos-14
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Init submodules
        run: git -c http.extraheader= submodule update --init --recursive
      - name: Test native one-click installer
        shell: bash
        run: bash scripts/test-install.sh

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable 2026-07-16

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config libssl-dev \
            musl-tools libclang-dev protobuf-compiler

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install lld llvm protobuf

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          workspaces: |
            src -> target
            src/deps/libkrun-sys/vendor/libkrun -> target
            containerd-shim -> target
          key: ${{ matrix.target }}

      - name: Test vendored libkrun TX backpressure
        working-directory: src/deps/libkrun-sys/vendor/libkrun
        run: |
          touch init/init
          cargo test --locked -p devices --features net backpressure -- --nocapture

      - name: Check compilation
        run: |
          cd src
          cargo check --locked --release -p a3s-box-cli -p a3s-box-shim
          if [ "${{ runner.os }}" = "Linux" ]; then
            cargo check --locked --release -p a3s-box-cri
          fi
      - name: Check containerd RuntimeClass shim
        if: runner.os == 'Linux'
        working-directory: containerd-shim
        run: cargo check --locked --release --all-targets

  # ── Windows native WHPX build check ────────────────────────────
  build-windows:
    name: Build Windows WHPX
    needs: [fmt, clippy, test, sdk-packages]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Init submodules
        run: git -c http.extraheader= submodule update --init --recursive
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable 2026-07-16
        with:
          targets: x86_64-pc-windows-msvc,x86_64-unknown-linux-musl
      - name: Verify bundled libkrun source archive
        shell: pwsh
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/package-libkrun-source.ps1 -Check
      - name: Verify bundled Windows libkrun archive
        shell: pwsh
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/package-libkrun-windows.ps1 -Check
      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
      - name: Build libkrun Linux init payload
        shell: pwsh
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File src/deps/libkrun-sys/vendor/libkrun/scripts/build-windows-init.ps1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          workspaces: src
          key: windows-whpx
      - name: Build Windows native binaries
        run: |
          Remove-Item Env:A3S_DEPS_STUB -ErrorAction SilentlyContinue
          $separator = [char]0x1f
          $env:CARGO_ENCODED_RUSTFLAGS = [string]::Join($separator, @(
            "--remap-path-prefix=$env:GITHUB_WORKSPACE=.",
            "--remap-path-prefix=$env:USERPROFILE=."
          ))
          cd src
          cargo build --locked --release -p a3s-box-cli -p a3s-box-shim --target x86_64-pc-windows-msvc
          cargo build --locked --release -p a3s-box-runtime --no-default-features --features vm `
            --example windows-whpx-oci-qualification --target x86_64-pc-windows-msvc
          Copy-Item `
            target/x86_64-pc-windows-msvc/release/examples/windows-whpx-oci-qualification.exe `
            target/x86_64-pc-windows-msvc/release/windows-whpx-oci-qualification.exe
      - name: Test Windows symlink diagnostics
        run: |
          cd src
          cargo test --locked -p a3s-box-core `
            denial_diagnostic_distinguishes_endpoint_policy
      - name: Test Windows CLI dispatch, build, and retained wait status
        run: |
          $runtime = (Resolve-Path `
            'src/deps/libkrun-sys/prebuilt/x86_64-pc-windows-msvc').Path
          $env:PATH = "$runtime;$env:PATH"
          cd src
          cargo test --locked -p a3s-box-cli --test wait_integration
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p a3s-box-cli --test command_coverage `
            test_build_from_scratch_copy_metadata_cli_smoke
      - name: Verify Windows artifact bundle
        shell: pwsh
        run: |
          $required = @(
            'src/target/x86_64-pc-windows-msvc/release/a3s-box.exe',
            'src/target/x86_64-pc-windows-msvc/release/a3s-box-shim.exe',
            'src/target/x86_64-pc-windows-msvc/release/windows-whpx-oci-qualification.exe',
            'src/target/x86_64-pc-windows-msvc/release/krun.dll',
            'src/target/x86_64-pc-windows-msvc/release/libkrunfw.dll'
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Required Windows artifact is missing: $path"
            }
          }
          $releaseDirectory = 'src/target/x86_64-pc-windows-msvc/release'
          $files = foreach ($path in $required) {
            $item = Get-Item -LiteralPath $path
            [ordered]@{
              name = $item.Name
              size = $item.Length
              sha256 = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            }
          }
          $manifest = [ordered]@{
            schema_version = 'a3s.box.windows-whpx-qualification-artifact.v1'
            source_commit = '${{ github.event.pull_request.head.sha || github.sha }}'
            workflow_commit = '${{ github.sha }}'
            run_id = '${{ github.run_id }}'
            run_attempt = '${{ github.run_attempt }}'
            files = $files
          }
          [IO.File]::WriteAllText(
            (Join-Path $releaseDirectory 'artifact-manifest.json'),
            (ConvertTo-Json -InputObject $manifest -Depth 10),
            (New-Object System.Text.UTF8Encoding($false))
          )
      - name: Test native one-click installer
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass `
            -File scripts/test-install.ps1 `
            -A3sBoxPath src/target/x86_64-pc-windows-msvc/release/a3s-box.exe `
            -ShimPath src/target/x86_64-pc-windows-msvc/release/a3s-box-shim.exe `
            -KrunDllPath src/target/x86_64-pc-windows-msvc/release/krun.dll `
            -FirmwareDllPath src/target/x86_64-pc-windows-msvc/release/libkrunfw.dll
      - name: Upload artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: windows-whpx
          path: |
            src/target/x86_64-pc-windows-msvc/release/a3s-box.exe
            src/target/x86_64-pc-windows-msvc/release/a3s-box-shim.exe
            src/target/x86_64-pc-windows-msvc/release/windows-whpx-oci-qualification.exe
            src/target/x86_64-pc-windows-msvc/release/krun.dll
            src/target/x86_64-pc-windows-msvc/release/libkrunfw.dll
            src/target/x86_64-pc-windows-msvc/release/artifact-manifest.json

  # ── Real Apple Silicon/HVF published-port gate ───────────────────
  # A hosted arm64 macOS runner is itself virtualized and cannot use HVF for a
  # nested guest. Keep the published-port regression on a physical Apple
  # Silicon runner so a source-only unit test cannot stand in for real virtio
  # queue progress.
  integration-hvf:
    name: Integration (real microVM, Apple Silicon/HVF)
    needs: [fmt, clippy, test, sdk-packages]
    if: github.event_name != 'pull_request' && vars.HVF_CI == 'true'
    runs-on: [self-hosted, macos, arm64, hvf]
    timeout-minutes: 90
    env:
      A3S_BOX_SMOKE_IMAGE: docker.io/library/alpine@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
      A3S_BOX_HVF_NODE_IMAGE: docker.io/library/node:22-alpine@sha256:c610fcdfb1d5b4740dd70c284ed3cb16bb857e0f7166196e36a5501df7a3aa32
      A3S_BOX_HVF_POSTGRES_IMAGE: docker.io/library/postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
      A3S_BOX_ALLOW_REGISTRY_PULL: "1"
      A3S_BOX_SMOKE_TIMEOUT_SECS: "600"
      A3S_REGISTRY_MIRRORS: ${{ vars.HVF_CI_REGISTRY_MIRRORS }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Init submodules
        run: git -c http.extraheader= submodule update --init --recursive
      - name: Verify physical Apple Silicon and HVF
        run: |
          test "$(uname -m)" = arm64
          test "$(sysctl -n kern.hv_support)" = 1
      - name: Use the runner's existing Rust toolchain
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" target add aarch64-unknown-linux-musl
      - name: Build real host binaries and guest init
        run: |
          unset A3S_DEPS_STUB
          cd src
          cargo zigbuild --locked --release -p a3s-box-guest-init \
            --target aarch64-unknown-linux-musl
          cargo build --locked --release -p a3s-box-cli -p a3s-box-shim
          codesign --entitlements shim/entitlements.plist --force -s - \
            target/release/a3s-box-shim
      - name: Qualify repeated published-port traffic after TX backpressure
        run: |
          unset A3S_DEPS_STUB
          evidence="$RUNNER_TEMP/a3s-box-hvf-published-port-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$evidence"
          {
            echo "box_revision=$GITHUB_SHA"
            echo "libkrun_revision=$(git -C src/deps/libkrun-sys/vendor/libkrun rev-parse HEAD)"
            echo "runner_arch=$(uname -m)"
            echo "hvf=$(sysctl -n kern.hv_support)"
            echo "postgres_image=$A3S_BOX_HVF_POSTGRES_IMAGE"
          } > "$evidence/metadata.txt"
          cd src
          cargo test --locked --release -p a3s-box-cli --test core_smoke \
            real_core_tsi_published_tcp_nonblocking_accept_and_exec \
            -- --ignored --nocapture --test-threads=1 \
            2>&1 | tee "$evidence/test.log"
      - name: Qualify sequential PostgreSQL SCRAM traffic after TX backpressure
        run: |
          unset A3S_DEPS_STUB
          evidence="$RUNNER_TEMP/a3s-box-hvf-published-port-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cd src
          cargo test --locked --release -p a3s-box-cli --test core_smoke \
            real_core_postgres_scram_survives_sequential_published_connections \
            -- --ignored --nocapture --test-threads=1 \
            2>&1 | tee "$evidence/postgres.log"
      - name: Qualify interrupted auto-removal and archived wait status
        run: |
          unset A3S_DEPS_STUB
          evidence="$RUNNER_TEMP/a3s-box-hvf-published-port-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cd src
          cargo test --locked --release -p a3s-box-cli --test core_smoke \
            real_core_foreground_auto_remove_handles_sigterm_and_archives_status \
            -- --ignored --nocapture --test-threads=1 \
            2>&1 | tee "$evidence/foreground-interruption.log"
      - name: Qualify guest-native persistence, recovery, and stopped maintenance
        run: |
          unset A3S_DEPS_STUB
          evidence="$RUNNER_TEMP/a3s-box-hvf-published-port-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cd src
          cargo test --locked --release -p a3s-box-cli \
            --test guest_native_rootfs_integration \
            -- --ignored --nocapture --test-threads=1 \
            2>&1 | tee "$evidence/guest-native-rootfs.log"
      - name: Qualify cold Corepack and bounded pnpm networking
        run: |
          unset A3S_DEPS_STUB
          evidence="$RUNNER_TEMP/a3s-box-hvf-published-port-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          pnpm_home="$(mktemp -d "$RUNNER_TEMP/a3s-box-hvf-pnpm.XXXXXX")"
          trap 'rm -rf -- "$pnpm_home"' EXIT
          A3S_HOME="$pnpm_home" \
            A3S_BOX="$GITHUB_WORKSPACE/src/target/release/a3s-box" \
            PNPM_PROJECT="$GITHUB_WORKSPACE/bench/fixtures/pnpm" \
            PNPM_IMAGE="$A3S_BOX_HVF_NODE_IMAGE" \
            PNPM_RUNS=1 \
            PNPM_TIMEOUT=600 \
            PNPM_NODE_MODULES=tmpfs \
            PNPM_LOG_DIR="$evidence/pnpm-logs" \
            bash bench/bench.sh pnpm \
            2>&1 | tee "$evidence/pnpm.log"
          echo "result=pass" > "$evidence/result.txt"
      - name: Reject leaked qualification shims
        if: always()
        run: |
          leaked="$(pgrep -f "$GITHUB_WORKSPACE/src/target/release/a3s-box-shim" || true)"
          if [ -n "$leaked" ]; then
            ps -fp $leaked || true
            kill -KILL $leaked || true
            echo "::error::Apple Silicon/HVF qualification left a shim behind"
            exit 1
          fi
      - name: Upload Apple Silicon/HVF evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: hvf-published-port-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/a3s-box-hvf-published-port-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error

  # ── Real microVM integration gate (self-hosted, /dev/kvm) ───────
  # The fmt/clippy/test/build jobs above all run in STUB mode
  # (A3S_DEPS_STUB) and never boot a real microVM, so a runtime
  # regression (boot, exec, virtio-fs, CRI lifecycle, snapshot-fork)
  # cannot be caught by hosted CI — GitHub-hosted runners have no
  # /dev/kvm. This job links REAL libkrun and runs the `#[ignore]`
  # integration + crictl-smoke suites against a real microVM.
  #
  # ARMING THE GATE (one-time, operator — see docs/ci-kvm-runner.md):
  #   1. Register a self-hosted runner that has /dev/kvm, with labels:
  #        self-hosted, linux, kvm
  #   2. Set repository variable  KVM_CI = true
  #        (Settings -> Secrets and variables -> Actions -> Variables)
  # Until both are done this job is SKIPPED (inert) and never blocks a PR.
  integration-kvm:
    name: Integration (real microVM, KVM)
    needs: [fmt, clippy, test, sdk-packages, sdk-local-sandbox]
    # Never execute arbitrary pull-request code on a persistent self-hosted
    # runner. After review, maintainers can dispatch this workflow against the
    # PR branch explicitly.
    if: github.event_name != 'pull_request' && vars.KVM_CI == 'true'
    runs-on: [self-hosted, linux, kvm]
    timeout-minutes: 120
    # The runner has no direct docker.io egress (CN network), so the smoke
    # tests pull alpine/busybox through a mirror. The image keeps its canonical
    # docker.io identity; only the fetch is redirected. Override per-runner with
    # the KVM_CI_REGISTRY_MIRRORS repo variable.
    env:
      A3S_REGISTRY_MIRRORS: ${{ vars.KVM_CI_REGISTRY_MIRRORS || 'docker.io=docker.m.daocloud.io' }}
      A3S_RUNTIME_MICROVM_CONFORMANCE_HOME: /tmp/a3s-runtime-conformance-microvm-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Init submodules
        run: git -c http.extraheader= submodule update --init --recursive
      # The self-hosted runner already has a working rustup/cargo. Using
      # dtolnay/rust-toolchain forces rustup to re-sync the whole `stable`
      # channel (7 components) on every run — ~20 min on this box's network,
      # which blew the job timeout. Use the runner's existing toolchain: add the
      # musl target (a fast no-op if already installed) and put cargo on PATH
      # for later steps (the runner service env does not source a login shell).
      - name: Use the runner's existing Rust toolchain
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" target add x86_64-unknown-linux-musl
      # NOTE: no Swatinem/rust-cache here — fetching that action from
      # codeload.github.com times out on this runner's network, which fails
      # "Set up job". The self-hosted runner keeps a warm cargo registry, and
      # the 120-min budget covers a cold libkrun build and Runtime recovery.
      - name: Verify /dev/kvm is present
        run: |
          if [ ! -e /dev/kvm ]; then
            echo "::error::/dev/kvm missing — this runner cannot boot microVMs"; exit 1
          fi
          echo "/dev/kvm present"
      # Build REAL binaries: unset the stub so libkrun-sys compiles the
      # vendored libkrun (build.rs gates on env::var("A3S_DEPS_STUB").is_ok(),
      # so the var must be UNSET, not just emptied).
      - name: Build real binaries + musl guest-init (no stub)
        run: |
          unset A3S_DEPS_STUB
          cd src
          cargo build --locked --release -p a3s-box-guest-init --target x86_64-unknown-linux-musl
          cargo build --locked --release -p a3s-box-cli -p a3s-box-cri -p a3s-box-shim
      - name: Prepare dedicated Runtime MicroVM conformance home
        run: |
          unset A3S_DEPS_STUB
          test ! -e "$A3S_RUNTIME_MICROVM_CONFORMANCE_HOME"
          install -d -m 0755 "$A3S_RUNTIME_MICROVM_CONFORMANCE_HOME/bin"
          install -m 0755 src/target/release/a3s-box-shim \
            "$A3S_RUNTIME_MICROVM_CONFORMANCE_HOME/bin/a3s-box-shim"
          install -m 0755 \
            src/target/x86_64-unknown-linux-musl/release/a3s-box-guest-init \
            "$A3S_RUNTIME_MICROVM_CONFORMANCE_HOME/bin/a3s-box-guest-init"
          install -d -m 0700 \
            "$A3S_RUNTIME_MICROVM_CONFORMANCE_HOME/runtime-secrets"
          sudo mount -t tmpfs \
            -o size=16m,mode=0700,nosuid,nodev,noexec \
            a3s-runtime-microvm-secrets \
            "$A3S_RUNTIME_MICROVM_CONFORMANCE_HOME/runtime-secrets"
          sudo chown "$(id -u):$(id -g)" \
            "$A3S_RUNTIME_MICROVM_CONFORMANCE_HOME/runtime-secrets"
          A3S_HOME="$A3S_RUNTIME_MICROVM_CONFORMANCE_HOME" \
            src/target/release/a3s-box pull \
              'docker.io/library/alpine@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc'
      - name: Core smoke — real boot + exec over virtio-fs
        run: |
          unset A3S_DEPS_STUB
          cd src
          cargo test --locked --release -p a3s-box-cli --test core_smoke -- --ignored --nocapture --test-threads=1
      - name: Rust local SDK — real MicroVM
        run: |
          unset A3S_DEPS_STUB
          export A3S_HOME
          A3S_HOME="$(mktemp -d /tmp/a3s-local-sdk-smoke.XXXXXX)"
          trap 'rm -rf "$A3S_HOME"' EXIT
          mkdir -p "$A3S_HOME/bin"
          install -m 755 src/target/release/a3s-box-shim \
            "$A3S_HOME/bin/a3s-box-shim"
          install -m 755 \
            src/target/x86_64-unknown-linux-musl/release/a3s-box-guest-init \
            "$A3S_HOME/bin/a3s-box-guest-init"
          cd src
          A3S_BOX_SDK_LOCAL_SMOKE=1 \
            A3S_BOX_SDK_SMOKE_ISOLATION=microvm \
            cargo test --locked --release -p a3s-box-sdk --test local_sandbox \
              local_sandbox_exercises_real_runtime \
              -- --ignored --nocapture --test-threads=1
      - name: Certify all advertised Runtime profiles through real MicroVMs
        run: |
          unset A3S_DEPS_STUB
          cd src
          A3S_HOME="$A3S_RUNTIME_MICROVM_CONFORMANCE_HOME" \
            A3S_BOX_RUNTIME_CONFORMANCE=1 \
            A3S_BOX_RUNTIME_CONFORMANCE_IMAGE='docker.io/library/alpine@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc' \
            A3S_BOX_RUNTIME_CONFORMANCE_MEDIA_TYPE='application/vnd.oci.image.index.v1+json' \
            A3S_REGISTRY_PROTOCOL=http \
            RUST_MIN_STACK=33554432 \
            cargo test --locked --release -p a3s-box-runtime --lib \
              box_runtime_microvm_passes_all_advertised_profiles \
              -- --ignored --nocapture --test-threads=1
      - name: Certify simulated SEV-SNP Runtime evidence through a real MicroVM
        run: |
          unset A3S_DEPS_STUB
          cd src
          A3S_HOME="$A3S_RUNTIME_MICROVM_CONFORMANCE_HOME" \
            A3S_BOX_RUNTIME_CONFORMANCE=1 \
            A3S_BOX_RUNTIME_CONFORMANCE_IMAGE='docker.io/library/alpine@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc' \
            A3S_BOX_RUNTIME_CONFORMANCE_MEDIA_TYPE='application/vnd.oci.image.index.v1+json' \
            A3S_REGISTRY_PROTOCOL=http \
            RUST_MIN_STACK=33554432 \
            cargo test --locked --release -p a3s-box-runtime --lib \
              box_runtime_sev_snp_simulated_passes_all_advertised_profiles \
              -- --ignored --nocapture --test-threads=1
      # Keep the cached foreground no-op inside a bounded production envelope.
      - name: Foreground latency — cached no-op p50 regression gate
        env:
          A3S_BOX: ${{ github.workspace }}/src/target/release/a3s-box
          IMAGE: ${{ vars.KVM_CI_AGENT_IMAGE || 'docker.m.daocloud.io/library/alpine:latest' }}
          FOREGROUND_RUNS: "10"
          FOREGROUND_WARMUPS: "1"
          # Default includes headroom for normal runner noise; dedicated
          # runners can tighten it with the repository variable.
          FOREGROUND_MAX_P50_MS: ${{ vars.KVM_CI_FOREGROUND_MAX_P50_MS || '3200' }}
        run: |
          unset A3S_DEPS_STUB
          chmod +x bench/bench.sh
          bench/bench.sh foreground
      - name: CRI crictl smoke — full pod/container lifecycle
        env:
          A3S_BOX_CRI_SMOKE: "1"
          A3S_BOX_CRI_SMOKE_AGENT_IMAGE: ${{ vars.KVM_CI_AGENT_IMAGE || 'docker.m.daocloud.io/library/alpine:latest' }}
          # A3S_REGISTRY_MIRRORS inherited from the job env (covers docker.io).
        run: |
          unset A3S_DEPS_STUB
          cd src
          cargo test --locked --release -p a3s-box-cri --test crictl_smoke -- --ignored --nocapture --test-threads=1
      # Gate leak-freeness under churn against REAL VMs: create/run/remove cycles
      # must return orphan shims / overlay mounts / box dirs to baseline. Exits
      # non-zero on a leak, so a resource-leak regression fails the gate.
      - name: Leak assertion — no orphan shims/mounts/box-dirs after churn
        env:
          A3S_BOX: ${{ github.workspace }}/src/target/release/a3s-box
          CHURN: "20"
        run: |
          unset A3S_DEPS_STUB
          chmod +x bench/bench.sh
          bench/bench.sh leak
      # Gate the cross-process advisory lock on boxes.json against REAL VMs:
      # concurrent `run -d` processes must NOT lose each other's state writes.
      # The unit tests only race in-process threads, so a broken/missing flock
      # across separate a3s-box processes is invisible to them — this boots a
      # fleet at once and asserts no lost update + intact JSON. Exits non-zero
      # on a lost update, failing the gate.
      - name: Race assertion — no lost update on boxes.json under concurrent run -d
        env:
          A3S_BOX: ${{ github.workspace }}/src/target/release/a3s-box
          RACE: "8"
        run: |
          unset A3S_DEPS_STUB
          chmod +x bench/bench.sh
          bench/bench.sh race
      # SDK programmable-CI pipeline against REAL microVMs: warm + CoW fork-per-step,
      # parallel collect-all, `::metric` extraction, fork isolation, leak-freeness,
      # and crash-orphan recovery (sweep_orphans). The unit suite only drives a fake
      # CLI, so this is the only gate that the real fork/snapshot path actually works.
      - name: SDK pipeline integration — real fork-per-step + sweep
        env:
          A3S_BOX: ${{ github.workspace }}/src/target/release/a3s-box
          A3S_SDK_TEST_IMAGE: ${{ vars.KVM_CI_AGENT_IMAGE || 'docker.m.daocloud.io/library/alpine:latest' }}
        run: |
          unset A3S_DEPS_STUB
          cd src
          cargo test --locked --release -p a3s-box-sdk --features pipeline-cli --test integration_kvm -- --ignored --nocapture --test-threads=1
      # Soak the fork-eval loop: sustained churn must stay leak-free (no orphan
      # boxes/snapshots, snapshot count flat) and memory-stable. Light here (120
      # fork-evals); crank A3S_SDK_SOAK_FORKS for a manual long soak.
      - name: SDK pipeline soak — leak-free under churn
        env:
          A3S_BOX: ${{ github.workspace }}/src/target/release/a3s-box
          A3S_SDK_TEST_IMAGE: ${{ vars.KVM_CI_AGENT_IMAGE || 'docker.m.daocloud.io/library/alpine:latest' }}
          A3S_SDK_SOAK_FORKS: "120"
        run: |
          unset A3S_DEPS_STUB
          cd src
          cargo test --locked --release -p a3s-box-sdk --features pipeline-cli --test soak_kvm -- --ignored --nocapture --test-threads=1
      - name: Clean Runtime MicroVM conformance home
        if: always()
        run: |
          cleanup_status=0
          leaked_pids="$(
            pgrep -f "a3s-box-shim.*$A3S_RUNTIME_MICROVM_CONFORMANCE_HOME" || true
          )"
          if [ -n "$leaked_pids" ]; then
            ps -fp $leaked_pids || true
            sudo kill -KILL $leaked_pids || true
            cleanup_status=1
          fi
          if mountpoint -q \
            "$A3S_RUNTIME_MICROVM_CONFORMANCE_HOME/runtime-secrets"; then
            sudo umount \
              "$A3S_RUNTIME_MICROVM_CONFORMANCE_HOME/runtime-secrets" || \
              cleanup_status=1
          fi
          sudo rm -rf -- "$A3S_RUNTIME_MICROVM_CONFORMANCE_HOME"
          exit "$cleanup_status"

  # Real SEV-SNP is deliberately separate from the ordinary KVM lane. The
  # simulated Evidence profile above verifies protocol wiring but is never
  # accepted as hardware security evidence.
  integration-sev-snp:
    name: Integration (hardware SEV-SNP)
    needs: [fmt, clippy, test]
    if: github.event_name != 'pull_request' && vars.SEV_SNP_CI == 'true'
    runs-on: [self-hosted, linux, kvm, sev-snp]
    timeout-minutes: 120
    env:
      A3S_REGISTRY_MIRRORS: ${{ vars.KVM_CI_REGISTRY_MIRRORS || 'docker.io=docker.m.daocloud.io' }}
      A3S_RUNTIME_SEV_SNP_CONFORMANCE_HOME: /tmp/a3s-runtime-conformance-sev-snp-${{ github.run_id }}-${{ github.run_attempt }}
      A3S_BOX_RUNTIME_CONFORMANCE_SEV_SNP_GENERATION: ${{ vars.SEV_SNP_CI_GENERATION }}
      A3S_BOX_RUNTIME_CONFORMANCE_SEV_SNP_MEASUREMENT: ${{ vars.SEV_SNP_CI_EXPECTED_MEASUREMENT }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Init submodules
        run: git -c http.extraheader= submodule update --init --recursive
      - name: Use the runner's existing Rust toolchain
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" target add x86_64-unknown-linux-musl
      - name: Verify hardware SEV-SNP capability and pinned policy
        run: |
          test -c /dev/kvm
          test -c /dev/sev
          test -r /sys/module/kvm_amd/parameters/sev_snp
          grep -Eq '^(Y|1)$' /sys/module/kvm_amd/parameters/sev_snp
          case "$A3S_BOX_RUNTIME_CONFORMANCE_SEV_SNP_GENERATION" in
            milan|genoa) ;;
            *) echo '::error::SEV_SNP_CI_GENERATION must be milan or genoa'; exit 1 ;;
          esac
          printf '%s' "$A3S_BOX_RUNTIME_CONFORMANCE_SEV_SNP_MEASUREMENT" \
            | grep -Eq '^[0-9a-f]{96}$'
      - name: Build real SEV-SNP Runtime artifacts
        run: |
          unset A3S_DEPS_STUB
          cd src
          cargo build --locked --release -p a3s-box-guest-init \
            --target x86_64-unknown-linux-musl
          cargo build --locked --release -p a3s-box-cli -p a3s-box-shim
      - name: Prepare dedicated SEV-SNP conformance home
        run: |
          unset A3S_DEPS_STUB
          test ! -e "$A3S_RUNTIME_SEV_SNP_CONFORMANCE_HOME"
          install -d -m 0755 "$A3S_RUNTIME_SEV_SNP_CONFORMANCE_HOME/bin"
          install -m 0755 src/target/release/a3s-box-shim \
            "$A3S_RUNTIME_SEV_SNP_CONFORMANCE_HOME/bin/a3s-box-shim"
          install -m 0755 \
            src/target/x86_64-unknown-linux-musl/release/a3s-box-guest-init \
            "$A3S_RUNTIME_SEV_SNP_CONFORMANCE_HOME/bin/a3s-box-guest-init"
          install -d -m 0700 \
            "$A3S_RUNTIME_SEV_SNP_CONFORMANCE_HOME/runtime-secrets"
          sudo mount -t tmpfs \
            -o size=16m,mode=0700,nosuid,nodev,noexec \
            a3s-runtime-sev-snp-secrets \
            "$A3S_RUNTIME_SEV_SNP_CONFORMANCE_HOME/runtime-secrets"
          sudo chown "$(id -u):$(id -g)" \
            "$A3S_RUNTIME_SEV_SNP_CONFORMANCE_HOME/runtime-secrets"
          A3S_HOME="$A3S_RUNTIME_SEV_SNP_CONFORMANCE_HOME" \
            src/target/release/a3s-box pull \
              'docker.io/library/alpine@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc'
      - name: Certify hardware SEV-SNP Runtime evidence
        run: |
          unset A3S_DEPS_STUB
          cd src
          A3S_HOME="$A3S_RUNTIME_SEV_SNP_CONFORMANCE_HOME" \
            A3S_BOX_RUNTIME_CONFORMANCE=1 \
            A3S_BOX_RUNTIME_CONFORMANCE_IMAGE='docker.io/library/alpine@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc' \
            A3S_BOX_RUNTIME_CONFORMANCE_MEDIA_TYPE='application/vnd.oci.image.index.v1+json' \
            A3S_REGISTRY_PROTOCOL=http \
            RUST_MIN_STACK=33554432 \
            cargo test --locked --release -p a3s-box-runtime --lib \
              box_runtime_sev_snp_hardware_passes_all_advertised_profiles \
              -- --ignored --nocapture --test-threads=1
      - name: Clean SEV-SNP conformance home
        if: always()
        run: |
          cleanup_status=0
          leaked_pids="$(
            pgrep -f "a3s-box-shim.*$A3S_RUNTIME_SEV_SNP_CONFORMANCE_HOME" || true
          )"
          if [ -n "$leaked_pids" ]; then
            ps -fp $leaked_pids || true
            sudo kill -KILL $leaked_pids || true
            cleanup_status=1
          fi
          if mountpoint -q \
            "$A3S_RUNTIME_SEV_SNP_CONFORMANCE_HOME/runtime-secrets"; then
            sudo umount \
              "$A3S_RUNTIME_SEV_SNP_CONFORMANCE_HOME/runtime-secrets" || \
              cleanup_status=1
          fi
          sudo rm -rf -- "$A3S_RUNTIME_SEV_SNP_CONFORMANCE_HOME"
          exit "$cleanup_status"
